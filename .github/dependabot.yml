version: 2
updates:
  # Python dependencies (uv: pyproject.toml + uv.lock).
  # Dependabot reads uv.lock under the "pip" ecosystem (there is no separate "uv" value).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle ALL version updates into one grouped PR.
      python-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      # Bundle ALL security updates into one grouped PR.
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
