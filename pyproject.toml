version = "0.1.0"
description = "My person blog"
authors = ["Andy Hoang"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
mkdocs = "==1.6.1"
mkdocs-awesome-pages-plugin = "==2.10.1"
