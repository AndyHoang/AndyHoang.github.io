[project]
name = "andyhoang-github-io"
version = "0.1.0"
description = "My person blog"
authors = [{ name = "Andy Hoang" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-awesome-pages-plugin==2.10.1",
    "mkdocs-encryptcontent-plugin==3.1.0",
    "mkdocs-git-revision-date-localized-plugin==1.5.4",
    "mkdocs-material==9.7.7",
    "mkdocs-material-extensions==1.3.1",
    "mkdocs-blogging-plugin==2.2.11",
]

[dependency-groups]
dev = []

[tool.uv]
default-groups = "all"
package = false # docs-only site, no Python package to build/install
